[config]
contrast = 0.1
theme = "dark" 

[templates.niri]
input_path = '~/.config/matugen/templates/niri-colors.kdl'
output_path = '~/.config/niri/colors.kdl'

[templates.kitty]
input_path  = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors.conf'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.gtk3]
input_path = '~/.config/matugen/templates/matugen-gtk.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark'

[templates.gtk4]
input_path = '~/.config/matugen/templates/matugen-gtk4.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.chromium]
input_path  = '~/.config/matugen/templates/root.css'
output_path = '~/code/tab-v3/color.css'

[templates.zathura]
input_path = '~/.config/matugen/templates/zathurarc'
output_path = '~/.config/zathura/zathurarc'

[templates.cava]
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/cava/themes/matugen'

[templates.lualine]
input_path  = '~/.config/matugen/templates/colors_lualine.lua'
output_path = '~/.config/nvim/after/plugin/matugen_colors.lua'

[templates.spotify]
input_path = '~/.config/matugen/templates/spice-color.ini'
output_path = '~/.config/spicetify/Themes/text/color.ini'

[templates.kvantum_kvconfig]
input_path = '~/.config/matugen/templates/kvmatugen.kvconfig'
output_path = '~/.config/Kvantum/matugen/matugen.kvconfig'

[templates.kvantum_svg]
input_path = '~/.config/matugen/templates/kvmatugen.svg'
output_path = '~/.config/Kvantum/matugen/matugen.svg'

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.vesktop]
input_path = '~/.config/matugen/templates/system24.css'
output_path = '~/.config/vesktop/themes/system24.css'

[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox.json'
output_path = '~/.cache/wal/colors.json'

[templates.quickshell]
input_path = '~/.config/matugen/templates/qs-colors.qml'
output_path = '~/.config/quickshell/Colors.qml'

