[global]
separator_height = 0
separator_color= frame
min_icon_size = 64
max_icon_size = 256
gap_size = 2
frame_color = "{{colors.surface_container.default.hex | lighten: 25 }}"
frame_width = 1
highlight = "{{colors.tertiary.default.hex}}"
font = JetBrainsMono Nerd font 13
width = (320, 550)
height = (50, 700)
progress_bar = true
progress_bar_height = 10
progress_bar_corner_radius = 0
progress_bar_frame_width = 1
progress_bar_min_width = 300
progress_bar_max_width = 300
padding = 6
origin = top-right
format = "<span foreground='#8a8a8aff'>%a</span>\n<b>%s</b>\n%b"
history_ignore = false

[urgency_low]
    background = "{{colors.surface_container.default.hex | lighten: 4}}A6"
    foreground = "{{colors.on_surface.default.hex}}"
    highlight = "{{colors.tertiary.default.hex}}"

[urgency_normal]
    background = "{{colors.surface_container.default.hex | lighten: 4}}A6"
    foreground = "{{colors.on_surface.default.hex}}"
    highlight = "{{colors.tertiary.default.hex}}"

[urgency_critical]
    background = "{{colors.error_container.default.hex}}A6"
    foreground = "{{colors.on_error_container.default.hex}}"
    highlight = "{{colors.tertiary.default.hex}}"

[volume_notifications]
    appname = volume
    summary = *
    history_ignore = true
    set_stack_tag = volume
    appname = volume
    min_icon_size = 64
    max_icon_size = 64

[brightness]
    appname = brightness
    summary = *
    history_ignore = true
    set_stack_tag = brightness
    min_icon_size = 64
    max_icon_size = 64

