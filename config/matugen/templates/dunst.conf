[global]
separator_color= frame
transparency = 20
frame_color = "{{colors.outline.default.hex}}"
frame_width = 0
highlight = "{{colors.tertiary.default.hex}}"
font = JetBrainsMono Nerd font 13
width = (300, 700)
height = (50, 500)
progress_bar = true
progress_bar_height = 10
progress_bar_corner_radius = 4
progress_bar_frame_width = 1
progress_bar_min_width = 300
progress_bar_max_width = 300
padding = 6
origin = top-right
format = "<b>%s</b>\n<span foreground='#9399b2ff'>%a</span>\n%b"


[urgency_low]
    background = "{{colors.surface_container.default.hex}}BF"
    foreground = "{{colors.on_surface.default.hex}}"

[urgency_normal]
    background = "{{colors.surface_container.default.hex}}BF"
    foreground = "{{colors.on_surface.default.hex}}"

[urgency_critical]
    background = "{{colors.error_container.default.hex}}BF"
    foreground = "{{colors.on_error_container.default.hex}}"

[volume_notifications]
    appname = volume
    summary = *
    history_ignore = true
    set_stack_tag = volume
    appname = volume

[brightness]
    appname = brightness
    summary = *
    history_ignore = true
    set_stack_tag = brightness


