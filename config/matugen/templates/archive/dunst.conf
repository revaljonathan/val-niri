[global]
separator_height = 0
separator_color= frame
min_icon_size = 64
markup = full
max_icon_size = 256
gap_size = 2
frame_color = "{{colors.surface_container.default.hex | lighten: 25 }}"
frame_width = 1
highlight = "{{colors.tertiary.default.hex}}"
font = IBM Plex Sans Regular 12
width = (320, 550)
height = (50, 700)
progress_bar = true
progress_bar_height = 10
progress_bar_corner_radius = 0
progress_bar_frame_width = 1
progress_bar_min_width = 300
progress_bar_max_width = 300
padding = 6
origin = top-right
format = "<span foreground='{{colors.outline.default.hex}}'>%a</span>\n<b>%s</b>\n%b"
history_ignore = false

[urgency_low]
    background = "{{colors.surface_container.default.hex | lighten: 4}}A6"
    foreground = "{{colors.on_surface.default.hex}}"
    highlight = "{{colors.tertiary.default.hex}}"

[urgency_normal]
    background = "{{colors.surface_container.default.hex | lighten: 4}}A6"
    foreground = "{{colors.on_surface.default.hex}}"
    highlight = "{{colors.tertiary.default.hex}}"

[urgency_critical]
    background = "{{colors.error_container.default.hex}}A6"
    foreground = "{{colors.on_error_container.default.hex}}"
    highlight = "{{colors.tertiary.default.hex}}"

[wifi]
    appname = wifi
    summary = *
    set_stack_tag = wifi
    min_icon_size = 64
    max_icon_size = 64

[media]
    appname = media
    summary = *
    set_stack_tag = 
    min_icon_size = 72
    max_icon_size = 72

[CPU profile]
    appname = CPU profile
    summary = *
    set_stack_tag = 
    min_icon_size = 64
    max_icon_size = 64   
